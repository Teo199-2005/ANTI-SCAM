<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <rect width="48" height="48" rx="10" fill="#fff"/>
  <!-- Green top stripe -->
  <rect x="0" y="0" width="48" height="16" rx="10" fill="#007A33"/>
  <rect x="0" y="8" width="48" height="8" fill="#007A33"/>
  <!-- Red bottom stripe -->
  <rect x="0" y="32" width="48" height="16" rx="10" fill="#E31837"/>
  <rect x="0" y="32" width="48" height="8" fill="#E31837"/>
  <!-- "7" in orange -->
  <text x="16" y="31" font-family="Arial Black,Arial,sans-serif" font-size="20" font-weight="900" fill="#F47920" text-anchor="middle">7</text>
  <!-- "ELEVEn" small -->
  <text x="32" y="28" font-family="Arial Black,Arial,sans-serif" font-size="7" font-weight="900" fill="#E31837" text-anchor="middle">ELEVE</text>
  <text x="34" y="35" font-family="Arial Black,Arial,sans-serif" font-size="7" font-weight="900" fill="#007A33" text-anchor="middle">n</text>
</svg>
