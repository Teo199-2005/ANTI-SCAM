# Optional: serve Laravel only on loopback so Node (Next BFF) can call it with
#   LARAVEL_API_BASE_URL=http://127.0.0.1:8080/api/v1
#
# Symptom without this: `curl http://127.0.0.1/api/v1/...` returns nginx HTML 404
# because your public :443/:80 vhost only proxies to Next.js (see nginx-next.example.conf),
# not to PHP.
#
# 1) Adjust root → your backend `public` path and fastcgi_pass → your PHP-FPM socket.
#    Run: ls -la /var/run/php/
#    Use the real *.sock name (often php8.1-fpm.sock — php8.2-fpm.sock only if that file exists).
# 2) sudo cp this file to /etc/nginx/sites-available/ and enable it, then:
#      sudo nginx -t && sudo systemctl reload nginx
# 3) curl -sS http://127.0.0.1:8080/api/v1/up   (expect JSON / small Laravel response)

server {
    listen 127.0.0.1:8080;
    listen [::1]:8080;
    server_name _;

    root /var/www/anti-scam/backend/public;
    index index.php;
    charset utf-8;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
