# Reverse-proxy Next.js (production). Replace server_name and upstream port.
# If Node BFF cannot reach Laravel: public HTTPS may only hit Next — use a loopback Laravel vhost
# (see nginx-laravel-loopback.example.conf) and set LARAVEL_API_BASE_URL=http://127.0.0.1:8080/api/v1
# Symptom this fixes: HTML loads but page looks "unstyled" because /_next/static/*.css
# returns 404, HTML, or wrong Content-Type instead of being proxied to `next start`.

upstream next_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 443 ssl http2;
    server_name anti-scamph.com www.anti-scamph.com;

    # ssl_certificate /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    # Xendit webhooks must reach Laravel (PHP). Prefer loopback :8080 (nginx-laravel-loopback.example.conf).
    location ^~ /api/v1/webhooks/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header x-callback-token $http_x_callback_token;
        proxy_read_timeout 60s;
    }

    location = /expired_xendit_ph.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/anti-scam/backend/public/expired_xendit_ph.php;
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
    }

    # Do not serve /.next from disk; always proxy to Node.
    location / {
        proxy_pass http://next_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        # Multipart (room photos, logos) — must exceed PHP post_max_size on the API upstream.
        client_max_body_size 280m;
    }
}

server {
    listen 80;
    server_name anti-scamph.com www.anti-scamph.com;
    return 301 https://$host$request_uri;
}
