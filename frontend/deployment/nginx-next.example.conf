# Reverse-proxy Next.js (production). Replace server_name and upstream port.
# Symptom this fixes: HTML loads but page looks "unstyled" because /_next/static/*.css
# returns 404, HTML, or wrong Content-Type instead of being proxied to `next start`.

upstream next_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 443 ssl http2;
    server_name anti-scamph.com www.anti-scamph.com;

    # ssl_certificate /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    # Do not serve /.next from disk; always proxy to Node.
    location / {
        proxy_pass http://next_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name anti-scamph.com www.anti-scamph.com;
    return 301 https://$host$request_uri;
}
